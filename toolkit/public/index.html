<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Toolkit · Live Markdown</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <h2>Outline</h2>
    <nav id="outline" aria-label="Document outline"><p>No document open.</p></nav>
  </aside>
  <main>
    <header class="topbar"><div class="topbar-heading"><button id="sidebar-toggle" aria-controls="sidebar" aria-expanded="true" aria-label="Hide sidebar">Hide sidebar</button><h1>Markdown to PDF</h1></div><span id="connection" role="status">Connecting…</span></header>
    <section class="file-panel" aria-label="Open local file">
      <label for="filepath">Markdown file</label>
      <form id="open-form"><input id="filepath" name="path" placeholder="/path/to/notes.md" autocomplete="off" spellcheck="false" required aria-describedby="path-help"><button id="open-button" type="submit">Open file</button></form>
      <p id="path-help">Save changes in your editor to update the preview.</p>
    </section>
    <div id="message" role="status" aria-live="polite" hidden></div>
    <section class="workspace">
      <div class="preview-toolbar"><div class="view-tabs" role="group" aria-label="Document view"><button id="preview-tab" class="selected" aria-pressed="true">Preview</button><button id="source-tab" aria-pressed="false">Source</button></div><div class="export-controls"><label for="paper" class="sr-only">Paper size</label><select id="paper"><option>A4</option><option>Letter</option></select><label for="pdf-background" class="sr-only">PDF background</label><select id="pdf-background" title="PDF background"><option value="white">White paper</option><option value="yellow">Yellow paper</option><option value="black">Black paper</option></select><button id="export-button" disabled>Export PDF</button></div></div>
      <div class="document-meta"><span id="filename">No file open</span><span id="updated">Waiting for your document</span></div>
      <div class="preview-area" id="preview-area">
        <div class="empty-state" id="empty"><p>Open a Markdown file to preview it.</p><button id="example-button">Open example</button></div>
        <iframe id="preview" title="Formatted Markdown preview" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
        <pre id="source" tabindex="0" aria-label="Saved Markdown source" hidden></pre>
      </div>
    </section>
  </main>
</body>
</html>
