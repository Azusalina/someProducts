<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080808">
  <title>Mediator</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main aria-label="Port directory">
    <section class="directory" aria-label="Listening services">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search ports or services" aria-label="Search ports and services">
        <div class="refresh-controls"><span id="scan-status" role="status">Scanning…</span><button id="refresh" type="button">Refresh</button></div>
      </div>
      <div class="filter-line">
        <div class="filters" role="group" aria-label="Filter services">
          <button type="button" class="filter active" data-filter="all" aria-pressed="true">All <span id="all-badge">0</span></button>
          <button type="button" class="filter" data-filter="web" aria-pressed="false">Web <span id="web-badge">0</span></button>
          <button type="button" class="filter" data-filter="other" aria-pressed="false">Other <span id="other-badge">0</span></button>
        </div>
        <span class="auto-refresh">Auto refresh: 10s</span>
      </div>
      <div id="notice" class="notice" role="alert" hidden></div>
      <p id="action-status" class="action-status" role="status" hidden></p>
      <div class="column-head" aria-hidden="true"><span>Port</span><span>Service / task</span><span>Connection</span><span>Actions</span></div>
      <div id="services" aria-live="polite" aria-busy="true"><div class="empty">Loading services…</div></div>
      <div class="directory-footer"><span id="visible-count">Scanning ports…</span></div>
    </section>
  </main>
  <template id="service-template">
    <article class="service">
      <div class="service-main">
        <div class="port-cell"><strong class="port-number"></strong><span class="protocol"></span></div>
        <div class="task-cell"><h3></h3><p class="description"></p><button class="details-toggle" type="button" aria-expanded="false">Details</button></div>
        <div class="connection-cell"><span class="connection-badge"></span><span class="connection-description"></span></div>
        <div class="action-cell"><a class="open-button" target="_blank" rel="noopener noreferrer">Open</a><button class="copy-button" type="button">Copy port</button><button class="terminate-button" type="button">Terminate</button></div>
      </div>
      <div class="service-details" hidden><dl></dl></div>
    </article>
  </template>
  <dialog id="terminate-dialog" aria-labelledby="terminate-title" aria-describedby="terminate-explanation">
    <h2 id="terminate-title">Terminate service?</h2>
    <p id="terminate-explanation">This sends SIGTERM to the processes using this port.</p>
    <ul id="terminate-processes"></ul>
    <p id="terminate-related"></p>
    <p id="terminate-error" role="alert" hidden></p>
    <div class="dialog-actions"><button id="terminate-cancel" type="button">Cancel</button><button id="terminate-confirm" class="terminate-button" type="button">Terminate</button></div>
  </dialog>
</body>
</html>
