[package]
name = "filex"
version = "1.5.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight horizontal-tree file explorer for Windows 11"

[dependencies]
crossterm = "0.29"
toml = "0.9"
toml_edit = "0.23"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
