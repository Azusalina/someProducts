<!doctype html>
<html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乐谱复核</title>
<style>
:root{color-scheme:dark;font:14px system-ui;color:#c4ccc2;background:#0c110f}*{box-sizing:border-box}body{margin:0}header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #29332d}h1{font-size:17px;margin:0 auto 0 0}button,select,input,textarea{font:inherit;color:inherit;background:#17211b;border:1px solid #344138;padding:7px;border-radius:3px}button,select{cursor:pointer}button:hover{background:#26392c}main{display:grid;grid-template-columns:minmax(500px,1fr) 370px;height:calc(100dvh - 75px)}#sheet{overflow:auto;padding:15px;background:#202621}#paper{position:relative;width:100%;background:white}#paper img{display:block;width:100%}#paper svg{position:absolute;inset:0;width:100%;height:100%}aside{padding:18px;overflow:auto}h2{font-size:14px;font-weight:600;margin:20px 0 10px}label{display:flex;gap:8px;align-items:start;margin:8px 0;line-height:1.5}p{font-size:12px;line-height:1.7;color:#8c9b8e}textarea{width:100%;min-height:70px;resize:vertical}#issues{display:flex;flex-direction:column;gap:6px}#issues button{text-align:left;font-size:12px}#issues button[aria-current]{border-color:#aec19e;background:#2a3c2d}#issue-detail{white-space:pre-wrap;font-size:12px;line-height:1.7}#verdict{width:100%}#status,#coverage{font-size:12px;color:#9eafa0}.issue-mark{cursor:pointer;fill:#bf964e44;stroke:#a56929;stroke-width:.6}.proposal{fill:#c4515155;stroke:#b44d4d}.selected{fill:#56abb866;stroke:#216b78;stroke-width:1}.measure-mark{fill:#ffff0020;stroke:#91862d;stroke-width:.7;pointer-events:none}input[type=checkbox]{accent-color:#aec19e;margin-top:4px}#zoom{width:65px}summary{cursor:pointer;font-size:12px}#download{white-space:nowrap}@media(max-width:900px){main{display:flex;flex-direction:column;height:auto}#sheet{height:60dvh}aside{width:100%}header{padding:12px}#measure{max-width:80vw}}
a{color:#9db7a3;text-underline-offset:3px}label:has(textarea){display:block}label textarea{margin-top:6px}
</style>
<header><h1>乐谱复核</h1><button id="previous" aria-label="上一小节">‹</button><select id="measure" aria-label="小节"></select><button id="next" aria-label="下一小节">›</button><label>缩放 <select id="zoom"><option value="100">100%</option><option value="150">150%</option><option value="200">200%</option></select></label><button id="download">导出人工标注</button><label>导入标注<input id="import" type="file" accept=".json" hidden></label><span id="coverage"></span></header>
<main><section id="sheet"><div id="paper"><img id="page" alt="原 PDF 页面"><svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg></div></section><aside><p id="summary"></p><p>红框为音高校正候选；橙框为原稿符头未匹配或八度范围。候选不等于正确答案，逐项核对后再标注。复核覆盖率不是识别准确率。</p><a href="candidate.musicxml" download>下载本轮候选 MusicXML</a><h2 id="measure-title"></h2><p id="measure-facts"></p><details><summary>整小节检查</summary><div id="checks"></div><label>校正／疑问<textarea id="measure-note"></textarea></label></details><h2>待复核项</h2><div id="issues"></div><p id="issue-detail"></p><select id="verdict" aria-label="当前项人工结论"><option value="unreviewed">未复核</option><option value="accept">接受校正候选</option><option value="reject">拒绝校正候选</option><option value="missing">确认漏音（需补写节奏）</option><option value="mapping">仅定位失败</option><option value="not-note">非音符</option><option value="verified-range">确认八度范围</option><option value="uncertain">不确定</option></select><label>当前项备注<textarea id="issue-note"></textarea></label><p id="status" role="status"></p><p>全部运算与标注留在本机。此页面不训练模型、不上传文件。导出的标注须与源文件哈希一致；尚未确认的项不会自动成为训练答案。</p></aside></main>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('review-data').textContent),$=id=>document.getElementById(id);
const dimensions={pitch:'音高／和弦／漏音',timing:'起奏／时值／连音',rests:'休止／不应出现的空拍',accidentals:'临时升降／还原与小节内延续',clefs:'谱号与行内转换',octaves:'八度标记及整段作用范围',curves:'延音线／连奏线与跨行衔接',ornaments:'倚音／装饰音／琶音'};
let labels={version:1,source_sha256:data.source_sha256,baseline_sha256:data.baseline_sha256,trained:false,measures:{},issues:{}},index=0,currentIssue=null;
const key='sheetvis.review:'+data.source_sha256+':'+data.baseline_sha256;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.source_sha256===data.source_sha256&&saved.baseline_sha256===data.baseline_sha256)labels=saved;}catch{}
function measureLabel(){return labels.measures[data.measures[index].index]??={checks:{},note:''};}
function issueLabel(){return currentIssue?(labels.issues[currentIssue.id]??={verdict:'unreviewed',note:''}):null;}
function save(){labels.trained=false;try{localStorage.setItem(key,JSON.stringify(labels));$('status').textContent='已保存在此浏览器；请导出标注备份。';}catch{$('status').textContent='浏览器存储不可用，请导出标注。';}coverage();}
function coverage(){const count=Object.values(labels.measures).filter(m=>Object.keys(dimensions).every(d=>m.checks?.[d]===true)).length;$('coverage').textContent=`整小节复核 ${count}/${data.measures.length}（不是准确率）`;}
$('summary').textContent=`${data.pages} 页 · ${data.exported_notes} 个导出音符 · ${data.proposal_count} 项音高校正候选 · 未训练模型`;
for(const m of data.measures){const option=new Option(`第 ${m.number} 小节 · PDF ${m.page} 页 · ${m.issues.length} 项`,String(m.index));$('measure').add(option);}
for(const [key,text]of Object.entries(dimensions)){const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.dataset.dimension=key;check.addEventListener('change',()=>{measureLabel().checks[key]=check.checked;save();});label.append(check,text);$('checks').append(label);}
function selectIssue(issue){currentIssue=issue;$('issue-detail').textContent=issue?issue.detail:'当前小节没有自动标出的冲突，仍需完整核对。';$('verdict').disabled=$('issue-note').disabled=!issue;const state=issueLabel();$('verdict').value=state?.verdict??'unreviewed';$('issue-note').value=state?.note??'';for(const button of $('issues').children)button.toggleAttribute('aria-current',button.dataset.issue===issue?.id);draw();}
function draw(){const m=data.measures[index],svg=$('overlay');svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${m.width} ${m.height}`);function rect(box,css,id){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const[k,v]of Object.entries({x:box[0],y:box[1],width:box[2]-box[0],height:box[3]-box[1]}))r.setAttribute(k,String(v));r.setAttribute('class',css);if(id){r.dataset.issue=id;r.setAttribute('tabindex','0');r.setAttribute('role','button');r.setAttribute('aria-label','选择原谱待复核项');const choose=()=>selectIssue(m.issues.find(i=>i.id===id));r.addEventListener('click',choose);r.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();choose();}});}svg.append(r);}
rect(m.box,'measure-mark');for(const issue of m.issues)rect(issue.box,'issue-mark'+(issue.kind==='proposal'?' proposal':'')+(issue.id===currentIssue?.id?' selected':''),issue.id);}
function render(){const m=data.measures[index];$('measure').value=String(m.index);$('measure-title').textContent=`第 ${m.number} 小节 · PDF ${m.page} 页`;$('measure-facts').textContent=m.facts;$('page').src=`pages/page-${String(m.page).padStart(2,'0')}.png`;$('page').alt=`原 PDF 第 ${m.page} 页`;$('page').onload=()=>{$('sheet').scrollTop=Math.max(0,m.box[1]/m.height*$('paper').clientHeight-70);};$('issues').replaceChildren();for(const issue of m.issues){const button=document.createElement('button');button.dataset.issue=issue.id;button.textContent=issue.title;button.addEventListener('click',()=>selectIssue(issue));$('issues').append(button);}const state=measureLabel();for(const check of $('checks').querySelectorAll('input'))check.checked=state.checks[check.dataset.dimension]===true;$('measure-note').value=state.note??'';selectIssue(m.issues[0]??null);$('previous').disabled=index===0;$('next').disabled=index===data.measures.length-1;coverage();}
$('previous').onclick=()=>{if(index>0){index--;render();}};$('next').onclick=()=>{if(index<data.measures.length-1){index++;render();}};$('measure').onchange=()=>{index=data.measures.findIndex(m=>String(m.index)===$('measure').value);render();};$('zoom').onchange=()=>{$('paper').style.width=$('zoom').value+'%';draw();};$('measure-note').oninput=()=>{measureLabel().note=$('measure-note').value;save();};$('verdict').onchange=()=>{const state=issueLabel();if(state){state.verdict=$('verdict').value;save();}};$('issue-note').oninput=()=>{const state=issueLabel();if(state){state.note=$('issue-note').value;save();}};
$('download').onclick=()=>{const blob=new Blob([JSON.stringify({...labels,exported_at:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='reviewed-labels.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('import').onchange=async()=>{try{const file=$('import').files?.[0];if(!file)return;const incoming=JSON.parse(await file.text());if(incoming.version!==1||incoming.source_sha256!==data.source_sha256||incoming.baseline_sha256!==data.baseline_sha256||!incoming.measures||!incoming.issues)throw new Error('标注格式或原文件哈希不匹配');labels=incoming;labels.trained=false;save();render();}catch(error){$('status').textContent=String(error);}$('import').value='';};render();
</script></html>
