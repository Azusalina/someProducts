<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>someProducts</title>
  <link rel="icon" href="data:,">
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem('someProducts:theme'); } catch {}
      document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
        ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    })();
  </script>
  <style>
    :root{--paper:#f7f6f3;--ink:#171717;--line:#d6d5d0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--paper);color-scheme:light}
    :root[data-theme="dark"]{--paper:#181818;--ink:#eae9e5;--line:#3e3e3b;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0}
    main{max-width:1200px;margin:0 auto;padding:36px 40px 28px}
    header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:72px}
    h1{margin:0;font-size:18px;line-height:1.4;letter-spacing:-.04em;font-weight:600}
    #theme-toggle{min-width:44px;min-height:44px;padding:8px 0;border:0;background:none;color:inherit;font-family:inherit;font-size:12px;cursor:pointer}
    #theme-toggle:hover{text-decoration:underline;text-underline-offset:3px}
    section{display:grid;grid-template-columns:128px minmax(0,1fr);border-top:2px solid var(--ink)}
    h2{margin:0;padding:21px 16px 20px 0;font-size:11px;line-height:1.4;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
    nav{min-width:0}
    a{color:inherit;text-decoration:none}
    nav a{display:block;padding:20px 0;border-bottom:1px solid var(--line);font-size:32px;line-height:1.2;letter-spacing:-.035em;font-weight:500;overflow-wrap:anywhere}
    nav a:last-child{border-bottom:0}
    .learning{margin-top:96px}
    nav a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.13em}
    a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:4px}
    footer{margin:64px 0 0 128px;font-size:12px;line-height:1.5}
    footer a:hover{text-decoration:underline;text-underline-offset:3px}
    @media(max-width:600px){
      main{padding:24px 20px}
      header{margin-bottom:48px}
      section{grid-template-columns:1fr}
      h2{padding:14px 0 4px}
      .learning{margin-top:64px}
      nav a{padding:18px 0}
      footer{margin:48px 0 0}
    }
  </style>
</head>
<body>
  <main>
    <header><h1>someProducts</h1><button id="theme-toggle" type="button" hidden>Dark</button></header>
    <section class="tools" aria-labelledby="tools-heading">
      <h2 id="tools-heading">Tools</h2>
      <nav aria-label="Tools">
        <a href="https://github.com/Azusalina/filex">filex</a>
        <a href="https://github.com/Azusalina/filex-win">filex-win</a>
        <a href="https://github.com/Azusalina/filex-linux-gui">filex-linux-gui</a>
        <a href="https://github.com/Azusalina/toolkit">toolkit</a>
        <a href="https://github.com/Azusalina/integrate-toolkit-arch">integrate-toolkit-arch</a>
        <a href="Visualize-graph/">graphVis</a>
        <a href="todos/">HKDSE Cutoffs</a>
      </nav>
    </section>
    <section class="learning" aria-labelledby="learning-heading">
      <h2 id="learning-heading">Learning</h2>
      <nav aria-label="Learning">
        <a href="ba/">Cost / Logic</a>
        <a href="gitpop/">Gitpop</a>
        <a href="ict/">Data / Logic</a>
        <a href="la/">Little Algebra</a>
        <a href="yupi-econ/">Yupi Economics</a>
        <a href="balladeIV-liebe/">Ballade IV / Liebestraum</a>
        <a href="hku/">HKU 2027</a>
        <a href="ict-notes/">ICT Unit C Notes</a>
        <a href="count-month/">Count Month</a>
      </nav>
    </section>
    <footer><a href="https://github.com/Azusalina/someProducts">GitHub</a></footer>
  </main>
  <script>
    (() => {
      const root = document.documentElement;
      const button = document.getElementById('theme-toggle');
      const system = matchMedia('(prefers-color-scheme: dark)');
      let followsSystem = true;
      try {
        const saved = localStorage.getItem('someProducts:theme');
        followsSystem = saved !== 'light' && saved !== 'dark';
      } catch {}
      function updateButton() {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        button.textContent = next === 'dark' ? 'Dark' : 'Light';
        button.setAttribute('aria-label', `Switch to ${next} mode`);
      }
      button.addEventListener('click', () => {
        followsSystem = false;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('someProducts:theme', root.dataset.theme); } catch {}
        updateButton();
      });
      system.addEventListener('change', event => {
        if (followsSystem) {
          root.dataset.theme = event.matches ? 'dark' : 'light';
          updateButton();
        }
      });
      updateButton();
      button.hidden = false;
    })();
  </script>
</body>
</html>
