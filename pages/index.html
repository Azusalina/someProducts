<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>someProducts</title>
  <link rel="icon" href="data:,">
  <style>
    :root{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#171717;background:#f7f6f3;color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0}
    main{max-width:1200px;margin:0 auto;padding:36px 40px 28px}
    header{margin-bottom:72px}
    h1{margin:0;font-size:18px;line-height:1.4;letter-spacing:-.04em;font-weight:600}
    section{display:grid;grid-template-columns:128px minmax(0,1fr);border-top:2px solid #171717}
    h2{margin:0;padding:21px 16px 20px 0;font-size:11px;line-height:1.4;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
    nav{min-width:0}
    a{color:inherit;text-decoration:none}
    nav a{display:block;border-bottom:1px solid #d6d5d0}
    nav a:last-child{border-bottom:0}
    .tools a{padding:18px 0 22px;font-size:clamp(38px,6.5vw,76px);line-height:1.1;letter-spacing:-.055em;font-weight:600;overflow-wrap:anywhere}
    .learning{margin-top:96px}
    .learning a{padding:18px 0;font-size:23px;line-height:1.3;letter-spacing:-.025em}
    nav a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.13em}
    a:focus-visible{outline:2px solid currentColor;outline-offset:4px}
    footer{margin:64px 0 0 128px;font-size:12px;line-height:1.5}
    footer a:hover{text-decoration:underline;text-underline-offset:3px}
    @media(max-width:600px){
      main{padding:24px 20px}
      header{margin-bottom:48px}
      section{grid-template-columns:1fr}
      h2{padding:14px 0 4px}
      .tools a{padding:17px 0 20px;font-size:clamp(30px,8.9vw,48px)}
      .learning{margin-top:64px}
      .learning a{padding:16px 0;font-size:21px}
      footer{margin:48px 0 0}
    }
  </style>
</head>
<body>
  <main>
    <header><h1>someProducts</h1></header>
    <section class="tools" aria-labelledby="tools-heading">
      <h2 id="tools-heading">Tools</h2>
      <nav aria-label="Tools">
        <a href="Visualize-graph/">graphVis</a>
        <a href="todos/">HKDSE Cutoffs</a>
      </nav>
    </section>
    <section class="learning" aria-labelledby="learning-heading">
      <h2 id="learning-heading">Learning</h2>
      <nav aria-label="Learning">
        <a href="ba/">Cost / Logic</a>
        <a href="gitpop/">Gitpop</a>
        <a href="ict/">Data / Logic</a>
        <a href="la/">Little Algebra</a>
        <a href="yupi-econ/">Yupi Economics</a>
      </nav>
    </section>
    <footer><a href="https://github.com/Azusalina/someProducts">GitHub</a></footer>
  </main>
</body>
</html>
