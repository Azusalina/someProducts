[package]
name = "filex-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A low-resource Linux GUI for the filex horizontal tree"

[[bin]]
name = "filex-gui"
path = "src/main.rs"

[dependencies]
# Same versions as ../fileX, whose tree model and file operations are compiled in.
toml = "0.9"
toml_edit = "0.23"
unicode-width = "0.2"
libc = "0.2"
vt100 = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# Software-rendered window: no GPU context, no toolkit runtime.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
ab_glyph = "0.2"
memmap2 = "0.9"
# Outbound drag-and-drop on winit's Wayland connection (same versions winit uses).
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
